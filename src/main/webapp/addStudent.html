<!DOCTYPE html>
<html>

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Add Student</title>

    <link rel="stylesheet"
          href="style.css">

</head>

<body>

<div class="container">

    <div class="form-card">

        <div class="form-icon">
            🎓
        </div>

        <h2>
            Add New Student
        </h2>

        <form action="addStudent"
              method="post">


            <div class="form-group">

                <label>
                    Student Name
                </label>

                <input type="text"
                       name="name"
                       placeholder="Enter student name"
                       required>

            </div>


            <div class="form-group">

                <label>
                    Email
                </label>

                <input type="email"
                       name="email"
                       placeholder="Enter email address"
                       required>

            </div>


            <div class="form-group">

                <label>
                    Course
                </label>

                <input type="text"
                       name="course"
                       placeholder="Enter course"
                       required>

            </div>


            <div class="form-group">

                <label>
                    Age
                </label>

                <input type="text"
                       name="age"
                       placeholder="Enter age">

            </div>


            <div class="form-buttons">

                <a href="index.html"
                   class="btn btn-secondary">

                    Cancel

                </a>


                <button type="submit"
                        class="btn btn-success">

                    Add Student

                </button>

            </div>


        </form>

    </div>

</div>

</body>

</html>
